services:
  # ====================================================================
  # Core Service: Connected Vehicle Analytics & Fleet Monitoring Dashboard
  # ====================================================================
  analytics-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: connected-vehicle-analytics:latest
    container_name: connected_vehicle_analytics
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      # Mount landing directory for live streaming simulation and reports for work orders
      - ./data/landing:/app/data/landing
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ====================================================================
# Architecture Notice Regarding Kafka & Spark:
# --------------------------------------------------------------------
# Neither Kafka nor Spark is required to run this core predictive analytics
# platform or Streamlit dashboard. The streaming simulation, ML inference,
# 12V/24V dynamic threshold alerts, and work order generation are fully
# self-contained and run locally inside the 'analytics-dashboard' container.
#
# The PySpark files under notebooks/ (00 to 05) are designed for cloud
# lakehouse deployments (e.g., Databricks Delta Lake) and do not run
# as background microservices in this container deployment.
# ====================================================================
